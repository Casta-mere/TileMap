# TileMap Configuration File
# 瓦片地图下载工具配置文件

# Web Server Settings
[server]
host = 0.0.0.0
port = 5000
debug = true

# Download Settings
[download]
# Default number of concurrent download threads
max_workers = 10

# Tile size in pixels (usually 256)
tile_size = 256

# Request timeout in seconds
timeout = 10

# User agent for HTTP requests
user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36

# Output Settings
[output]
# Default output directory for tiles
output_dir = tiles

# Default style
default_style = standard

# Whether to stitch tiles by default
auto_stitch = true

# Image format for stitched output (PNG or JPEG)
stitch_format = PNG

# Map Styles
# You can add custom tile server URLs here
# Format: style_name = url_template
# Use {x}, {y}, {z} as placeholders for tile coordinates and zoom level
[styles]
custom_osm = https://tile.openstreetmap.org/{z}/{x}/{y}.png
custom_carto_light = https://cartodb-basemaps-a.global.ssl.fastly.net/light_all/{z}/{x}/{y}.png
custom_carto_dark = https://cartodb-basemaps-a.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png
